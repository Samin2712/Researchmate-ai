# Standalone production stack: docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-researchmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-researchmate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
      target: production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-researchmate}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-researchmate}
      SECRET_KEY: ${SECRET_KEY:?Set a strong stable SECRET_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      VECTOR_STORE_MODE: database
      UPLOAD_DIR: /app/uploads
      ENVIRONMENT: production
      DEBUG: 'false'
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      target: production
      args:
        VITE_API_URL: /api/v1
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres_data:
  backend_uploads:
  backend_data:
